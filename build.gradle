plugins {
	id "com.crystaelix.loom" version "1.13-SNAPSHOT"
	id "eclipse"
	id "idea"
	id "maven-publish"
	id "com.crystaelix.blossom" version "1.3.2"
	id "me.modmuss50.mod-publish-plugin" version "1.0.0"
}

repositories {
	mavenCentral()
	flatDir {
		dirs "libs"
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.parchmentmc.net/"
			}
		}
		filter {
			includeGroup "org.parchmentmc.data"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.nucleoid.xyz/"
			}
		}
		filter {
			includeGroup "eu.pb4"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.terraformersmc.com/"
			}
		}
		filter {
			includeGroup "com.terraformersmc"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.blamejared.com/"
			}
		}
		filter {
			includeGroup "mezz.jei"
			includeGroup "vazkii.patchouli"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.crystaelix.com/releases/"
			}
		}
		filter {
			includeGroup "thelm.jeidrawables"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.ladysnake.org/releases/"
			}
		}
		filter {
			includeGroup "dev.onyxstudios.cardinal-components-api"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.draylar.dev/releases/"
			}
		}
		filter {
            includeGroup "dev.draylar.omega-config"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://cursemaven.com/"
			}
		}
		filter {
			includeGroup "curse.maven"
		}
	}
}

def mcVersion = "1.19.3"
def modName = "ArchonJEI"
def modId = "archonjei"
def specVersion = "19.3"
def vendor = "thelm"

group = "thelm.archonjei"
version = "19.3.0"

def archivesName = modName
base.archivesName = archivesName

sourceSets {
	main
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
		vendor = JvmVendorSpec.AZUL
	}
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
}

loom {
	silentMojangMappingsLicense()
	mixin.defaultRefmapName = "${modId}.refmap.json"
	runs {
		configureEach {
			property "fabric.log.console.level", "debug"
		}
		client {
			programArg "--username=Dev"
		}
		server
	}
}

dependencies {
	// Minecraft
	minecraft "com.mojang:minecraft:1.19.3"
	mappings loom.layered {
		officialMojangMappings {
			nameSyntheticMembers = false
		}
		parchment "org.parchmentmc.data:parchment-1.19.3:2023.06.25@zip"
	}
	modImplementation "net.fabricmc:fabric-loader:0.17.2"
	modImplementation "net.fabricmc.fabric-api:fabric-api:0.76.1+1.19.3"
	modImplementation "eu.pb4:placeholder-api:2.0.0-rc.1+1.19.3"
	modImplementation "com.terraformersmc:modmenu:5.1.0"

	// JEI
	modImplementation("mezz.jei:jei-1.19.3-fabric:12.4.0.22") {transitive = false}
	include(modImplementation("thelm.jeidrawables:JEIDrawables-Fabric:19.3.4"))

	// Archon
	modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-api:5.1.0"
	modImplementation "dev.draylar.omega-config:omega-config-base:1.3.0+1.19.2"
	implementation "me.zeroeightsix:fiber:0.23.0-2"
	modImplementation "vazkii.patchouli:Patchouli:1.19.3-78-FABRIC"
	modImplementation "curse.maven:fabric-disable-custom-worlds-advice-401978:3827588"
	modImplementation "curse.maven:archon-575339:4500140"
}

def replacements = [
	"0@VERSION@": version
]

blossom {
	replaceToken(replacements)
}

processResources {
	inputs.properties(replacements)
	filesMatching(["mcmod.info", "META-INF/mods.toml", "META-INF/neoforge.mods.toml", "fabric.mod.json"]) {
		filter {
			it.replace(replacements)
		}
	}
}

def manifestAttributes = [
	"Specification-Title": modName,
	"Specification-Vendor": vendor,
	"Specification-Version": specVersion,
	"Implementation-Title": archivesName,
	"Implementation-Version": version,
	"Implementation-Vendor": vendor
]

jar {
	manifest.attributes(manifestAttributes)
}

sourcesJar {
	manifest.attributes(manifestAttributes)
}

publishing {
	publications {
		register("mavenJava", MavenPublication) {
			artifactId = archivesName
			artifact remapJar
			artifact remapSourcesJar
		}
	}
	repositories {
		if(project.hasProperty("CrystaelixMavenUsername") && project.hasProperty("CrystaelixMavenPassword")) {
			maven {
				name = "CrystaelixMaven"
				url = "https://maven.crystaelix.com/releases/"
				credentials(PasswordCredentials)
			}
		}
	}
}

publishMods {
	file = remapJar.archiveFile
	version = displayName = project.version
	changelog = file("changelog.md").text
	type = STABLE
	modLoaders.add("fabric")
	additionalFiles.from(remapSourcesJar.archiveFile)

	curseforge {
		accessToken = providers.gradleProperty("curseforge.token")
		projectId = "1329485"
		minecraftVersions.add(mcVersion)
		requires "jei", "archon"
		incompatible "roughly-enough-items-hacks", "emi"
	}

	modrinth {
		accessToken = providers.gradleProperty("modrinth.token")
		projectId = "oaN2MnKC"
		minecraftVersions.add(mcVersion)
		requires "jei", "archon"
		incompatible "roughly-enough-items-hacks", "emi"
	}
}
